[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kospi-dividend-rotation-analyzer"
version = "0.1.0"
description = "KOSPI dividend and semiconductor rotation analyzer foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "altair>=5.5,<7",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
    "tzdata>=2025.2",
    "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
